<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Construir uma galeria simples de imagens acompanhadas por descrições alternativas.">
    <meta name="keywords" content="HTML5, CSS3, exercício 9, galeria de imagens">
    <meta name="author" content="Gilvam J. T. de Oliveira">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <title>Galeria de imagens</title>
</head>

<body>
<header class="page-header">
    <div class="container">
        <span class="eyebrow">Exercício 09</span>
        <h1>Galeria de imagens</h1>
        <p>Construir uma galeria simples de imagens acompanhadas por descrições alternativas.</p>
    </div>
</header>

<main class="container">
    <section class="card exercise-panel">
        <div class="exercise-content">
<h2 class="demo-title">Galeria de Paisagens</h2>
<div class="gallery">
    <figure>
        <a href="https://mundoeducacao.uol.com.br/geografia/floresta-tropical.htm" title="Ver imagem ampliada" target="_blank" rel="noopener noreferrer">
            <img src="assets/img/Floresta tropical ao entardecer.jpg" alt="Paisagem verde de floresta">
        </a>
        <figcaption>Floresta tropical ao entardecer.</figcaption>
    </figure>
    <figure>
        <a href="https://www.diariodolitoral.com.br/turismo/turistas-caminham-sobre-um-espelho-dagua-que-surgiu-do-nada-entre-as-dunas-da-lagoa-da-conceicao-depois-das-chuvas-de-agosto-o-fenomeno-batizado-de-lencois-manezinhos-encanta-a-todos-mas-biolo/" title="Ver imagem ampliada" target="_blank" rel="noopener noreferrer">
            <img src="assets/img/Lago calmo refletindo o céu.jpg" alt="Paisagem de lago azul">
        </a>
        <figcaption>Lago calmo refletindo o céu.</figcaption>
    </figure>
    <figure>
        <a href="https://ffms.pt/pt-pt/atualmentes/dunas-historia-para-la-das-areias" title="Ver imagem ampliada" target="_blank" rel="noopener noreferrer">
            <img src="assets/img/Dunas de areia sob o sol forte.jpg" alt="Paisagem de deserto">
        </a>
        <figcaption>Dunas de areia sob o sol forte.</figcaption>
    </figure>
    <figure>
        <a href="https://www.serranewsrj.com.br/2026/07/mar-de-nuvens-e-por-do-sol-em-nova-friburgo.html" title="Ver imagem ampliada" target="_blank" rel="noopener noreferrer">
            <img src="assets/img/Montanhas ao entardecer com tons roxos no céu.jpg" alt="Paisagem de montanha roxa">
        </a>
        <figcaption>Montanhas ao entardecer, com tons roxos no céu.</figcaption>
    </figure>
</div>
        </div>
    </section>
</main>

<footer class="page-footer">
    <div class="container"><strong>Exercício 09</strong> — Galeria de imagens</div>
</footer>
    <script src="../../js/exercise-nav.js" data-exercise-nav defer></script>
</body>

</html>
