<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Agrupe campos relacionados com fieldset e legend para tornar formulários longos mais compreensíveis.">
    <meta name="keywords" content="HTML5, CSS3, exercício 56, fieldset e legend">
    <meta name="author" content="Gilvam J. T. de Oliveira">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <title>Fieldset e Legend</title>
</head>

<body>
<header class="page-header">
    <div class="container">
        <span class="eyebrow">Exercício 56</span>
        <h1>Fieldset e Legend</h1>
        <p>Agrupe campos relacionados com fieldset e legend para tornar formulários longos mais compreensíveis.</p>
    </div>
</header>

<main class="container">
    <section class="card exercise-panel">
        <div class="exercise-content">
<section class="demo-block">
        <h2 class="demo-title">Cadastro de endereço</h2>
        <form action="#" method="post" class="form-grid">
            <fieldset>
                <legend>Dados pessoais</legend>
                <div class="form-grid two-columns nested-grid">
                    <div class="field">
                        <label for="nome-fs">Nome</label>
                        <input id="nome-fs" name="nome" type="text" autocomplete="name" required>
                    </div>
                    <div class="field">
                        <label for="email-fs">E-mail</label>
                        <input id="email-fs" name="email" type="email" autocomplete="email" required>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>
                <div class="form-grid two-columns nested-grid">
                    <div class="field">
                        <label for="cep">CEP</label>
                        <input id="cep" name="cep" type="text" autocomplete="postal-code" placeholder="00000-000">
                    </div>
                    <div class="field">
                        <label for="rua">Rua</label>
                        <input id="rua" name="rua" type="text" autocomplete="address-line1">
                    </div>
                    <div class="field">
                        <label for="numero">Número</label>
                        <input id="numero" name="numero" type="text" inputmode="numeric">
                    </div>
                    <div class="field">
                        <label for="cidade">Cidade</label>
                        <input id="cidade" name="cidade" type="text" autocomplete="address-level2">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Preferências de contato</legend>
                <div class="option-list">
                    <label class="option">
                        <input type="checkbox" name="contato" value="email" checked>
                        <span>E-mail</span>
                    </label>
                    <label class="option">
                        <input type="checkbox" name="contato" value="telefone">
                        <span>Telefone</span>
                    </label>
                </div>
            </fieldset>

            <div class="actions">
                <button class="btn" type="submit">Salvar endereço</button>
            </div>
        </form>
    </section>
        </div>
    </section>
</main>

<footer class="page-footer">
    <div class="container"><strong>Exercício 56</strong> — Fieldset e Legend</div>
</footer>
    <script src="../../js/exercise-nav.js" data-exercise-nav defer></script>
</body>

</html>
